# Olimex ESP32-EVB
substitutions:
  can_tx_pin: GPIO5
  can_rx_pin: GPIO35
  board: esp32-evb
  variant: esp32
  flash_size: 4MB

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0
  power_pin: GPIO32
  manual_ip:
    static_ip: 192.168.40.220
    gateway: 192.168.40.1
    subnet: 255.255.255.0
