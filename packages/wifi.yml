wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_rrm: true
  enable_btm: true
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    password: !secret wifi_hotspot_password


text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"

improv_serial:
